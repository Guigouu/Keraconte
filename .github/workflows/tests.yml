name: tests

# Valide le socle multi-plateforme : la suite doit passer sur Linux, Windows
# et macOS. C'est le SEUL signal Windows/macOS du projet (on développe sous
# Linux, on ne peut ni cross-compiler ni cross-tester). Test uniquement — pas
# de build d'exécutable ici (ce sera la Phase 4, PyInstaller).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Un OS rouge ne doit pas masquer le résultat des deux autres : c'est
      # tout l'intérêt de la matrice ici (repérer QUELLE plateforme casse).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # L'offscreen suffit pour Qt en tête sans serveur d'affichage.
      QT_QPA_PLATFORM: offscreen
      # tesseract lit ses données de langue ici (voir étapes par OS). Sous
      # Linux le pack système pose déjà « fra » ; sur Windows/macOS on télécharge
      # « fra.traineddata » dans ce dossier. configurer_tesseract() respecte
      # une valeur déjà posée.
      TESSDATA_PREFIX: ${{ github.workspace }}/tessdata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13 pour ce premier passage : version conservatrice sous
          # requires-python >= 3.12, dont on sait les roues disponibles.
          # 3.14 (local) sera ajouté une fois le vert obtenu.
          python-version: "3.13"

      # --- Dépendances système Qt (Linux seulement) ---------------------------
      # Le plugin offscreen lie quand même libEGL/libxkbcommon/libdbus : sans
      # ces libs, chaque test d'overlay échoue sur « could not load the Qt
      # platform plugin ». Windows/macOS n'ont besoin de rien de plus.
      - name: Libs système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      # --- tesseract + données « fra » ----------------------------------------
      # test_detection.py OCRise de vraies fixtures en lang="fra" : sans le
      # binaire ET le pack de langue, 86 tests échouent — pour une raison de
      # provisionnement, pas de portabilité. On installe donc les deux
      # explicitement, et « --list-langs » rend un « fra » manquant évident.

      - name: tesseract + fra (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra
          mkdir -p "$TESSDATA_PREFIX"
          # Copie fra dans notre TESSDATA_PREFIX pour un chemin uniforme.
          cp "$(dpkg -L tesseract-ocr-fra | grep fra.traineddata)" "$TESSDATA_PREFIX/"
          # eng est souvent attendu par tesseract au chargement.
          cp "$(find /usr/share -name eng.traineddata | head -1)" "$TESSDATA_PREFIX/" || true

      - name: tesseract + fra (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract
          mkdir -p "$TESSDATA_PREFIX"
          curl -fsSL -o "$TESSDATA_PREFIX/fra.traineddata" \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata
          curl -fsSL -o "$TESSDATA_PREFIX/eng.traineddata" \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata

      - name: tesseract + fra (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --no-progress -y tesseract
          # choco ne touche pas forcément au PATH : on désigne le binaire via
          # QR_TESSERACT (l'échappatoire câblée dans configurer_tesseract).
          $bin = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          "QR_TESSERACT=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path $env:TESSDATA_PREFIX | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata" `
            -OutFile "$env:TESSDATA_PREFIX/fra.traineddata"
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" `
            -OutFile "$env:TESSDATA_PREFIX/eng.traineddata"

      - name: Diagnostic tesseract (Linux/macOS)
        # Un « fra » manquant se lit ici d'un coup d'œil, plutôt qu'en 86
        # échecs cryptiques plus loin. Sur Windows tesseract n'est pas dans le
        # PATH (on l'appelle via QR_TESSERACT) : on saute ce diagnostic.
        if: runner.os != 'Windows'
        run: tesseract --list-langs
        continue-on-error: true

      # --- Dépendances Python -------------------------------------------------
      # On installe le cœur + l'extra [test]. PAS l'extra [linux] : PyGObject
      # et dbus-python compilent depuis les sources et sont fragiles à
      # provisionner. test_capture.py utilise importorskip et se SAUTE
      # proprement -> la CI rapporte 245 passed + 2 skipped (et non 247), ce
      # qui est le résultat ATTENDU, pas une régression. La capture Linux
      # reste validée en local et en jeu.
      - name: Installer le paquet
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: pytest
        run: pytest -q
